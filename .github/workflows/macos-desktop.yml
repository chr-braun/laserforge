name: macOS Desktop App

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Build Swift app
        run: cd packaging/swift && swift build -v

      - name: Run tests
        run: cd packaging/swift && swift test

      - name: Create app bundle
        run: cd packaging/swift && chmod +x build_app.sh && ./build_app.sh ../dist

      - name: Create distribution zip
        run: |
          cd packaging/dist
          zip -r Steckwerk-Desktop-macOS.zip "Steckwerk Desktop.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steckwerk-Desktop-macOS
          path: packaging/dist/Steckwerk-Desktop-macOS.zip
          retention-days: 7

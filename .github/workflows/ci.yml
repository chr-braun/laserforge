name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12"]
        include:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Alle Modelle bauen und prüfen
        run: python cli.py --model alle --validate -q
      - name: Beispielpaket prüfen
        run: python cli.py --paket-pruefen beispiel-pakete/tuerschild
